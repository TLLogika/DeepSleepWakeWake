services:
  wakeboard:
    build: .
    network_mode: host
    user: "${WAKEBOARD_UID:-1000}:${WAKEBOARD_GID:-1000}"
    cap_add:
      - NET_RAW
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: ["python3", "app.py", "--host", "${WAKEBOARD_HOST:-0.0.0.0}", "--port", "${WAKEBOARD_PORT:-9000}"]
