services:
  wakeboard:
    build: .
    network_mode: host
    environment:
      WAKEBOARD_UID: "${WAKEBOARD_UID:-1000}"
      WAKEBOARD_GID: "${WAKEBOARD_GID:-1000}"
      WAKEBOARD_SECURE_COOKIE: "${WAKEBOARD_SECURE_COOKIE:-0}"
    cap_add:
      - NET_RAW
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: ["python3", "app.py", "--host", "0.0.0.0", "--port", "9000"]
